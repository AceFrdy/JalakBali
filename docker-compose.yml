version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jalakbali_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jalakbali}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_HOST_AUTH_METHOD: trust
    expose:
      - "5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data

  # Backend Laravel (Filament Admin + API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jalakbali_backend
    restart: always
    depends_on:
      - postgres
    environment:
      APP_NAME: "Jalak Bali Admin"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://api-dev.kabinetsengkuni.com}
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-jalakbali}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
    expose:
      - "8000"
    volumes:
      - storage_data:/var/www/html/storage

  # Frontend Next.js
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api-dev.kabinetsengkuni.com}
    container_name: jalakbali_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api-dev.kabinetsengkuni.com}
    expose:
      - "3000"

volumes:
  postgres_data_v2:
  storage_data:
