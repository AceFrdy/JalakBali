version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jalakbali_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jalakbali}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Laravel (Filament Admin + API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jalakbali_backend
    restart: always
    depends_on:
      - postgres
    environment:
      APP_NAME: "Jalak Bali Admin"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:-base64:generate_key_here}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-jalakbali}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/var/www/html/storage

  # Frontend Next.js
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
    container_name: jalakbali_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  storage_data:
